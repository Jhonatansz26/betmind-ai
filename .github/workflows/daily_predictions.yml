name: Ejecutar Predicciones Diarias BetMind AI

on:
  schedule:
    # GitHub cron is UTC. Run every two hours to keep the rolling -2h/+36h window warm.
    - cron: '0 */2 * * *'
  workflow_dispatch:

concurrency:
  group: betmind-data-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-batch-predictions:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e packages/ml
          pip install -r apps/api/requirements.txt

      - name: Sincronizar partidos en ventana móvil
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
        run: python scripts/sync_today_matches.py

      - name: Ejecutar Predicciones Batch
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/batch_predict.py --mode full --limit 150
