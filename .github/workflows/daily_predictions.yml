name: Predicciones frecuentes BetMind AI

# Este workflow corre cada 2h porque batch_predict y evaluate_predictions
# trabajan sobre datos ya persistidos y no consumen API-Football. El sync de
# fixtures, la ingesta de estadísticas y CLV tienen workflows separados con
# frecuencias limitadas para proteger la cuota diaria del plan Free.

on:
  schedule:
    # GitHub cron is UTC. Run every two hours to keep the rolling -2h/+36h window warm.
    - cron: '0 */2 * * *'
  workflow_dispatch:

concurrency:
  group: betmind-data-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-batch-predictions:
    runs-on: ubuntu-latest

    # Definir variables globales para todos los pasos del job
    env:
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      DEBUG: "false"

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e packages/ml
          pip install -r apps/api/requirements.txt

      - name: Ejecutar Predicciones Batch
        run: |
          python scripts/batch_predict.py --mode full --limit 150

      - name: Evaluar predicciones contra resultados reales
        # Idempotente (ON CONFLICT DO NOTHING): evalúa solo partidos FINISHED
        # con predicción aún no evaluada. Sin alertas todavía — solo datos.
        run: python -m apps.api.jobs.evaluate_predictions --days 30
