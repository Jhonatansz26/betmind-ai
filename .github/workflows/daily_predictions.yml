name: Ejecutar Predicciones Diarias BetMind AI

on:
  schedule:
    - cron: '0 6,14 * * *'
  workflow_dispatch:

jobs:
  run-batch-predictions:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install python-dotenv groq duckduckgo-search pydantic pydantic-settings httpx sqlalchemy asyncpg
          pip install -e packages/ml
          pip install -e apps/api || true
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Ejecutar Predicciones Batch
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          python scripts/batch_predict.py --mode full --limit 150
