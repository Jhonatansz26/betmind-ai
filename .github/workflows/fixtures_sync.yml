name: Sincronizar fixtures y cuotas BetMind AI

# Este workflow corre cada 6h: mantiene la ventana mÃ³vil de fixtures/cuotas
# sin repetir 12 veces al dÃ­a las llamadas de fallback a API-Football. Las
# predicciones frecuentes consumen Ãºnicamente los datos ya persistidos.

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: betmind-fixtures-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync-fixtures:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      DEBUG: "false"
      AUTO_CREATE_TABLES: "false"

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e packages/ml
          pip install -r apps/api/requirements.txt

      - name: Sincronizar partidos en ventana mÃ³vil
        run: python scripts/sync_today_matches.py
