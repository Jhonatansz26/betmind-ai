name: Reprocesamiento de webhook events BetMind AI

# Reintenta los eventos crudos de Wompi (webhook_events) que quedaron en
# "received"/"failed" sin procesar (worker de background caÃ­do o fallo
# transitorio). Corre cada 15 minutos: es barato (suele no encontrar nada)
# y es la red de seguridad que garantiza que un evento no se pierda aunque
# el webhook ya haya respondido 200 a Wompi.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: betmind-webhook-reprocess
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reprocess-webhook-events:
    runs-on: ubuntu-latest
    continue-on-error: true

    env:
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      DEBUG: "false"
      AUTO_CREATE_TABLES: "false"

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e packages/ml
          pip install -r apps/api/requirements.txt

      - name: Reprocesar webhook events atascados
        run: python -m apps.api.jobs.reprocess_webhook_events
