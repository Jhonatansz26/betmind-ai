name: Ingestar estadísticas BetMind AI

# Este workflow corre una vez al día: procesa hasta 25 partidos pendientes,
# priorizando predicciones con EV, y evita gastar 12 preflights diarios del
# cron de predicciones. El límite protege la cuota Free y permite drenar el
# backlog progresivamente.

on:
  schedule:
    - cron: '15 3 * * *'
  workflow_dispatch:

concurrency:
  group: betmind-statistics-ingest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest-statistics:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      DEBUG: "false"

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e packages/ml
          pip install -r apps/api/requirements.txt

      - name: Ingestar estadísticas post-partido
        run: python -m apps.api.jobs.ingest_match_statistics --days 30
