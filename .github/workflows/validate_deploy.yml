name: Validación de imports y dependencias

# Corre en CADA push/PR: instala las dependencias en limpio, importa todos
# los módulos del backend y corre la suite completa. Detecta imports rotos
# o dependencias faltantes ANTES de llegar a Render — así no se gastan
# deploys ni cuota de Render en errores evitables.

on:
  push:
    branches: [main, 'agent/**']
  pull_request:

concurrency:
  group: betmind-validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    # Env dummies para CI: sin .env, los módulos que validan config en
    # import-time (SECRET_KEY, batch_predict exige DATABASE_URL) necesitan
    # valores mínimos. Nunca se conectan de verdad (sqlite in-memory).
    env:
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      SECRET_KEY: "ci-smoke-secret-key-1234567890"
      REDIS_URL: "redis://localhost:6379/0"

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias (mismo set que Render)
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt
          pip install -e packages/ml

      - name: Smoke test de imports (todos los módulos)
        run: python scripts/smoke_imports.py

      - name: Suite de tests completa
        run: pytest tests/ -q

  # Valida el Dockerfile (el que usa Render): si builda acá, builda en Render.
  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Build de la imagen Docker
        run: docker build --no-cache -t betmind-api .
