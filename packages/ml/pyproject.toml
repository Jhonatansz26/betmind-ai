[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "betmind-ml"
version = "1.0.0"
description = "Motor predictivo cuantitativo para apuestas deportivas con valor esperado positivo (+EV)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}
authors = [
    {name = "BetMind AI Team"}
]
dependencies = [
    "scipy>=1.11.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]
narrative = [
    "google-genai>=2.14.0",
    "instructor>=1.0.0",
    "duckduckgo-search>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["betmind_ml"]
